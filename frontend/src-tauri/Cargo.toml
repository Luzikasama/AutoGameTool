[package]
name = "autogametool"
version = "0.1.0"
description = "轻量级游戏自动化脚本工具"
authors = ["AutoGameTool"]
edition = "2021"

[lib]
name = "autogametool_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
