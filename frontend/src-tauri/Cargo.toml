[package]
name = "autogametool"
version = "0.1.1"
description = "轻量级游戏自动化脚本工具 · 桌面壳（Tauri 2）"
authors = ["AutoGameTool"]
edition = "2021"

[lib]
name = "autogametool_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# 用系统默认浏览器打开外链（顶栏「关于 → GitHub 发布页」）
tauri-plugin-opener = "2"
# 第二次启动时把已有窗口提到前台，而不是再起一个实例
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 桌面壳本身很小：release 走「体积优先」配置
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
